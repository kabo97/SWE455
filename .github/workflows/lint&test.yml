name: Lint and Test

on: [pull_request]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Run HTML Linter
      run: npm run html:lint

    - name: Run CSS Linter
      run: npm run css:lint

    - name: Run JS Linter
      run: npm run lint

    - name: Run Unit Tests
      run: npm test
