        with:
          node-version: 18
      - run: npm install
      - run: npm test
      - name: Upload Jest test report
        uses: actions/upload-artifact@v3
        with:
          name: server3-test-report
          path: ./server3/test-report.json

  test-aggregator:
    name: Test Aggregator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./aggregator
    steps:
      - uses: actions/checkout@v3
