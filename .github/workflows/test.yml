name: Run Tests on All Servers

on: [push, pull_request]

jobs:
  test-server1:
    name: Test Server 1
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server1
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm install
      - run: npm test
      - name: Upload Jest test report
        uses: actions/upload-artifact@v3
        with:
          name: server1-test-report
          path: ./server1/test-report.json

  test-server2:
    name: Test Server 2
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server2
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
